name: gameserver-deploy
on:
  workflow_dispatch:

concurrency:
  group: gameserver-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: self-hosted      # 맥 러너 (Unity 라이선스·docker·git 자격증명 ambient)
    steps:
      # clean: false = Library/를 보존한다. 기본값(clean)은 무시 파일까지 지워 Library/가 사라지는데,
      # Linux IL2CPP의 sysroot·툴체인은 스텁 패키지의 에디터 코드가 내려받아 등록하는 구조라
      # 콜드 프로젝트의 첫 Unity 실행에서는 "Unable to find an Linux Sysroot"로 반드시 실패한다.
      # (셀프호스트 Unity CI에서 Library를 보존·캐시하는 것은 표준 practice이며 임포트 시간도 줄인다.)
      - uses: actions/checkout@v4
        with:
          clean: false

      # clean:false의 대가 — 직전 실행의 산출물이 남는다. 빌드가 실패해도 옛 실행 파일이 남아 있으면
      # 뒤의 `test -f`가 통과해 실패를 성공으로 오인하고 낡은 바이너리를 이미지에 싣게 된다.
      - name: 직전 빌드 산출물 제거
        run: rm -rf GameServer/Build-x86_64 GameServer/Build-arm64 unity-x86_64.log unity-arm64.log

      - name: sha 산출
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 의존 UPM 패키지 레포 체크아웃 (file:../../ 형제 위치)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/.."
          for r in GameFramework LeagueOfPhysical-Shared LeagueOfPhysical-MasterData-Server; do
            if [ -d "$r/.git" ]; then
              git -C "$r" fetch --depth 1 origin && git -C "$r" reset --hard @{u}
            else
              git clone --depth 1 "https://github.com/Baeinsoo/$r" "$r"
            fi
            echo "$r @ $(git -C "$r" rev-parse --short HEAD)"
          done

      - name: NuGet 패키지 복원 (NuGetForUnity CLI, packages.config 기반)
        run: |
          set -e
          dotnet tool restore
          dotnet tool run nugetforunity restore .
          test -f Assets/NuGetForUnity/Packages/AutoMapper.11.0.0/lib/netstandard2.1/AutoMapper.dll

      - name: Unity IL2CPP 빌드 (amd64 + arm64)
        run: |
          set -eo pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          for ARCH in x86_64 arm64; do
            echo "::group::Unity build $ARCH"
            if ! LOP_BUILD_ARCH=$ARCH "$UNITY" -batchmode -quit -nographics -projectPath . \
                  -executeMethod BuildScript.BuildLinuxServer -logFile - > unity-$ARCH.log 2>&1; then
              echo "::error::Unity build $ARCH failed"
              # tail만 찍으면 Unity가 요약을 마지막에 쓰기 때문에 *원인* 줄이 잘려 나간다.
              # 실제 에러는 로그 중간에 있으므로 따로 골라 찍고, 전문은 아티팩트로 올린다.
              echo "::group::error/exception lines"
              grep -inE "error CS[0-9]+|BuildFailedException|^Error|Exception:|Failed to|not found|missing" \
                   unity-$ARCH.log | tail -60 || echo "(매칭 없음)"
              echo "::endgroup::"
              echo "::group::last 150 lines"
              tail -150 unity-$ARCH.log
              echo "::endgroup::"
              exit 1
            fi
            tail -5 unity-$ARCH.log
            test -f GameServer/Build-$ARCH/lop-server.x86_64
            echo "::endgroup::"
          done

      # 성공/실패 무관하게 올린다 — 성공한 빌드의 로그도 다음 실패와 비교할 기준선이 된다.
      - name: Unity 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-logs
          path: unity-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: 도커 멀티아치 빌드·푸시 (amd64+arm64 manifest)
        working-directory: GameServer
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          # launchd 러너는 맥 keychain에 접근 못 함. docker login 대신 임시 DOCKER_CONFIG에
          # inline auth(base64 user:token)를 직접 써넣어 keychain/credsStore를 완전히 우회.
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT   # 셀프호스트 맥 — 토큰이 담긴 config를 잡 종료 시 제거
          AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64)"
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > "$DOCKER_CONFIG/config.json"
          SHA="${{ steps.tag.outputs.sha }}"
          BASE="re5nardo/game-server"
          # 아치별 산출이 서로 달라 buildx 단일 컨텍스트 불가 → 아치별 이미지 push 후 manifest로 합침
          docker build --platform linux/amd64 --build-arg BUILD_DIR=Build-x86_64 -t "$BASE:$SHA-amd64" .
          docker push "$BASE:$SHA-amd64"
          docker build --platform linux/arm64 --build-arg BUILD_DIR=Build-arm64 -t "$BASE:$SHA-arm64" .
          docker push "$BASE:$SHA-arm64"
          # 멀티아치 매니페스트 — buildx imagetools가 아치별 이미지(OCI index 포함)를 견고하게 합침
          # (docker manifest create --amend는 per-arch가 index면 실패).
          docker buildx imagetools create -t "$BASE:$SHA" "$BASE:$SHA-amd64" "$BASE:$SHA-arm64"
          echo "pushed multiarch $BASE:$SHA"

      - name: infra game-server-config 태그 bump
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -e
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT   # .git/config에 토큰이 남으므로 잡 종료 시 클론 제거
          # keychain 우회 — 토큰을 URL에 임베드 (GitHub Actions가 로그에서 마스킹)
          git clone --depth 1 "https://x-access-token:${INFRA_REPO_TOKEN}@github.com/Baeinsoo/infrastructure" "$TMP/infra"
          cd "$TMP/infra"
          CM=k8s/apps/backend/game-server-config/configmap.yaml
          # GAME_SERVER_IMAGE 값을 새 sha로 교체 (BSD sed — 맥 러너)
          sed -i '' -E "s|(GAME_SERVER_IMAGE: ).*|\\1re5nardo/game-server:${{ steps.tag.outputs.sha }}|" "$CM"
          if git diff --quiet; then
            echo "변경 없음 (태그 동일)"
          else
            git config user.name "lop-ci"
            git config user.email "ci@lop.local"
            git commit -am "ci(gameserver): bump GAME_SERVER_IMAGE -> ${{ steps.tag.outputs.sha }} [skip ci]"
            git push origin main
          fi
