name: gameserver-deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "배포 환경 (local=내 로컬 클러스터, dev=iwinv, both=둘 다 — dev 라이브 클러스터에도 반영됨, 주의)"
        required: true
        default: local
        type: choice
        options: [local, dev, both]
      upload_symbols:
        description: "크래시 심볼을 아티팩트로 남긴다 (약 1.9GB — 네이티브 크래시를 조사할 때만)"
        required: false
        default: false
        type: boolean

concurrency:
  group: gameserver-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: self-hosted      # 맥 러너 (Unity 라이선스·docker·git 자격증명 ambient)
    steps:
      # clean: false = Library/를 보존한다. 기본값(clean)은 무시 파일까지 지워 Library/가 사라지는데,
      # Linux IL2CPP의 sysroot·툴체인은 스텁 패키지의 에디터 코드가 내려받아 등록하는 구조라
      # 콜드 프로젝트의 첫 Unity 실행에서는 "Unable to find an Linux Sysroot"로 반드시 실패한다.
      # (셀프호스트 Unity CI에서 Library를 보존·캐시하는 것은 표준 practice이며 임포트 시간도 줄인다.)
      - uses: actions/checkout@v4
        with:
          clean: false

      # clean:false의 대가 — 직전 실행의 산출물이 남는다. 빌드가 실패해도 옛 실행 파일이 남아 있으면
      # 뒤의 `test -f`가 통과해 실패를 성공으로 오인하고 낡은 바이너리를 이미지에 싣게 된다.
      - name: 직전 빌드 산출물 제거
        run: rm -rf GameServer/Build-x86_64 GameServer/Build-arm64 unity-x86_64.log unity-arm64.log

      - name: sha 산출
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 의존 UPM 패키지 레포 체크아웃 (file:../../ 형제 위치)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/.."
          for r in GameFramework LeagueOfPhysical-Shared LeagueOfPhysical-MasterData-Server; do
            if [ -d "$r/.git" ]; then
              git -C "$r" fetch --depth 1 origin && git -C "$r" reset --hard @{u}
            else
              git clone --depth 1 "https://github.com/Baeinsoo/$r" "$r"
            fi
            echo "$r @ $(git -C "$r" rev-parse --short HEAD)"
          done

      - name: NuGet 패키지 복원 (NuGetForUnity CLI, packages.config 기반)
        run: |
          set -e
          dotnet tool restore
          dotnet tool run nugetforunity restore .
          test -f Assets/NuGetForUnity/Packages/AutoMapper.11.0.0/lib/netstandard2.1/AutoMapper.dll

      # Linux IL2CPP의 sysroot·툴체인은 스텁 패키지(com.unity.sdk.linux-*, com.unity.toolchain.*)의
      # 임포트·설치가 끝나야 빌드 파이프라인에 등록된다. 그런데 그 임포트가 *빌드를 실행하는 같은*
      # 배치 세션에서는 제때 끝나지 않아, Library/가 없는 콜드 실행의 첫 빌드가
      # "Unable to find an Linux Sysroot"로 죽는다(2026-07-30 실측: 실패 로그엔 그 패키지의 첫 임포트
      # 흔적이 있고 성공 로그엔 없다). clean:false로 Library를 보존하면 두 번째 실행부터 성공하지만,
      # 러너를 새로 깔거나 워크스페이스가 지워지면 첫 실행이 또 실패한다.
      # 그래서 임포트만 하는 세션을 빌드 앞에 한 번 둔다. Library가 따뜻하면 수십 초로 끝난다.
      - name: Unity 프로젝트 워밍업 (sysroot 패키지 임포트)
        run: |
          set -eo pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          if ! "$UNITY" -batchmode -quit -nographics -projectPath . -logFile - > unity-warmup.log 2>&1; then
            echo "::error::Unity 워밍업 실패"; tail -80 unity-warmup.log; exit 1
          fi
          tail -3 unity-warmup.log

      - name: Unity IL2CPP 빌드 (amd64 + arm64)
        run: |
          set -eo pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          for ARCH in x86_64 arm64; do
            echo "::group::Unity build $ARCH"
            if ! LOP_BUILD_ARCH=$ARCH "$UNITY" -batchmode -quit -nographics -projectPath . \
                  -executeMethod BuildScript.BuildLinuxServer -logFile - > unity-$ARCH.log 2>&1; then
              echo "::error::Unity build $ARCH failed"
              # tail만 찍으면 Unity가 요약을 마지막에 쓰기 때문에 *원인* 줄이 잘려 나간다.
              # 실제 에러는 로그 중간에 있으므로 따로 골라 찍고, 전문은 아티팩트로 올린다.
              echo "::group::error/exception lines"
              grep -inE "error CS[0-9]+|BuildFailedException|^Error|Exception:|Failed to|not found|missing" \
                   unity-$ARCH.log | tail -60 || echo "(매칭 없음)"
              echo "::endgroup::"
              echo "::group::last 150 lines"
              tail -150 unity-$ARCH.log
              echo "::endgroup::"
              exit 1
            fi
            tail -5 unity-$ARCH.log
            test -f GameServer/Build-$ARCH/lop-server.x86_64
            echo "::endgroup::"
          done

      # 성공/실패 무관하게 올린다 — 성공한 빌드의 로그도 다음 실패와 비교할 기준선이 된다.
      - name: Unity 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-logs
          path: |
            unity-*.log
          if-no-files-found: warn
          retention-days: 14

      # 네이티브 크래시는 로그에 주소만 남긴다. 그 주소를 함수 이름으로 바꾸려면 이 심볼이 필요한데,
      # 다음 배포가 시작될 때 빌드 폴더를 지우므로 러너에는 최근 것 하나만 남는다.
      #
      # 그래도 **평소에는 올리지 않는다** — 우리 게임 코드의 심볼(GameAssembly.debug)만 두 아치 합쳐
      # 1.8GB라, 매 배포마다 쌓으면 이미지에서 걷어낸 것보다 큰 짐이 된다. 네이티브 크래시를 실제로
      # 조사할 때 이 체크박스를 켜고 다시 굽는 편이 싸다(같은 커밋이면 같은 심볼이 나온다).
      #
      # 같은 폴더의 il2cppOutput(IL2CPP가 만든 C++ 소스)은 켜도 빼둔다 — 크래시를 읽는 데 안 쓰인다.
      - name: 크래시 심볼 업로드
        if: ${{ inputs.upload_symbols }}
        uses: actions/upload-artifact@v4
        with:
          name: gameserver-symbols-${{ steps.tag.outputs.sha }}
          path: |
            GameServer/Build-*/*_BackUpThisFolder_ButDontShipItWithYourGame/*.debug
            GameServer/Build-*/*_BackUpThisFolder_ButDontShipItWithYourGame/Managed/**
          # 유니티가 폴더 이름을 바꾸면 조용히 빈 아티팩트가 된다 — 요약에 경고로 남기되 배포는 막지
          # 않는다(심볼은 배포의 전제가 아니다).
          if-no-files-found: warn
          retention-days: 30

      - name: 도커 멀티아치 빌드·푸시 (amd64+arm64 manifest)
        working-directory: GameServer
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          # launchd 러너는 맥 keychain에 접근 못 함. docker login 대신 임시 DOCKER_CONFIG에
          # inline auth(base64 user:token)를 직접 써넣어 keychain/credsStore를 완전히 우회.
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT   # 셀프호스트 맥 — 토큰이 담긴 config를 잡 종료 시 제거
          # 도커 CLI 플러그인(buildx/imagetools)은 $DOCKER_CONFIG/cli-plugins에서 찾는다.
          # 임시 config로 갈아타면 ~/.docker/cli-plugins의 buildx가 안 보여 "unknown command: docker buildx"가 난다.
          if [ -d "$HOME/.docker/cli-plugins" ]; then ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"; fi
          docker buildx version   # 플러그인이 보이는지 먼저 확인 — 안 보이면 여기서 명확히 실패
          AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64)"
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > "$DOCKER_CONFIG/config.json"
          SHA="${{ steps.tag.outputs.sha }}"
          BASE="re5nardo/game-server"
          # 레거시 빌더는 --platform을 무시하고 호스트(arm64) 베이스를 당겨, amd64 빌드가
          # "does not provide the specified platform (linux/amd64)"로 죽는다. buildx로 빌드한다.
          # docker-container 드라이버 + --push = 외래 아치 이미지를 로컬 데몬에 load할 필요가 없다.
          # (Dockerfile의 apt-get 단계 때문에 비네이티브 아치는 QEMU 에뮬레이션으로 돌아 느리다.)
          docker buildx create --name lop-builder --driver docker-container --bootstrap --use 2>/dev/null \
            || docker buildx use lop-builder
          # 아치별 산출 디렉토리가 달라 단일 컨텍스트 불가 → 아치별로 push 후 manifest로 합침
          docker buildx build --platform linux/amd64 --build-arg BUILD_DIR=Build-x86_64 \
            -t "$BASE:$SHA-amd64" --push .
          docker buildx build --platform linux/arm64 --build-arg BUILD_DIR=Build-arm64 \
            -t "$BASE:$SHA-arm64" --push .
          # 멀티아치 매니페스트 — buildx imagetools가 아치별 이미지(OCI index 포함)를 견고하게 합침
          # (docker manifest create --amend는 per-arch가 index면 실패).
          docker buildx imagetools create -t "$BASE:$SHA" "$BASE:$SHA-amd64" "$BASE:$SHA-arm64"
          echo "pushed multiarch $BASE:$SHA"

      - name: infra game-server-config 태그 bump
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -e
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT   # .git/config에 토큰이 남으므로 잡 종료 시 클론 제거
          # keychain 우회 — 토큰을 URL에 임베드 (GitHub Actions가 로그에서 마스킹)
          git clone --depth 1 "https://x-access-token:${INFRA_REPO_TOKEN}@github.com/Baeinsoo/infrastructure" "$TMP/infra"
          cd "$TMP/infra"
          if [ "${{ inputs.environment }}" = "both" ]; then
            envs=(local dev)
          else
            envs=("${{ inputs.environment }}")
          fi
          for env in "${envs[@]}"; do
            F="k8s/envs/$env/backend/game-server-config.env"
            test -f "$F" || { echo "환경 파일 없음: $F"; exit 1; }
            # BSD sed (맥 러너). KEY=value 라인의 값만 교체한다.
            sed -i '' -E "s|(GAME_SERVER_IMAGE=).*|\\1re5nardo/game-server:${{ steps.tag.outputs.sha }}|" "$F"
            echo "bumped $env -> re5nardo/game-server:${{ steps.tag.outputs.sha }}"
          done
          if git diff --quiet; then
            echo "변경 없음 (태그 동일)"
          else
            git config user.name "lop-ci"
            git config user.email "ci@lop.local"
            git commit -am "ci(gameserver): bump GAME_SERVER_IMAGE (${{ inputs.environment }}) -> ${{ steps.tag.outputs.sha }} [skip ci]"
            git push origin main
          fi
